name: Build plugin

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  RACK_SDK_VERSION: 2.6.6

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            runner: ubuntu-22.04
            sdk: lin-x64
            shell: bash
          - name: macOS arm64
            runner: macos-15
            sdk: mac-arm64
            shell: bash
          - name: macOS x64
            runner: macos-15-intel
            sdk: mac-x64
            shell: bash
          - name: Windows x64
            runner: windows-2022
            sdk: win-x64
            shell: msys2 {0}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSYS2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            make
            jq
            zstd
            unzip
            rsync
            mingw-w64-x86_64-toolchain

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y jq zstd

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install zstd jq

      - name: Download Rack SDK
        run: |
          curl -fsSL -o rack-sdk.zip "https://vcvrack.com/downloads/Rack-SDK-${RACK_SDK_VERSION}-${{ matrix.sdk }}.zip"
          unzip -q rack-sdk.zip
          rm rack-sdk.zip

      - name: Build and package
        run: make -j4 dist RACK_DIR=Rack-SDK

      - uses: actions/upload-artifact@v4
        with:
          name: coastal-${{ matrix.sdk }}
          path: dist/*.vcvplugin
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches plugin.json version
        run: |
          version=$(jq -r .version plugin.json)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match plugin.json version $version" >&2
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l artifacts
          gh release create "$GITHUB_REF_NAME" artifacts/*.vcvplugin \
            --title "coastal ${GITHUB_REF_NAME#v}" --generate-notes
